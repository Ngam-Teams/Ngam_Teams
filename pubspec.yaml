name: ngam_teams
description: "Ngam Teams – Staff Portal for the Ngam ecosystem."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Supabase backend
  supabase_flutter: ^2.8.4

  # Navigation
  go_router: ^15.1.2

  # UI utilities
  google_fonts: ^6.2.1
  hugeicons: ^1.1.7
  liquid_glass_widgets: 0.5.0

  # Utilities
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
